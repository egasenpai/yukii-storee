<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pterodactyl — Yuki Store</title>
    <link rel="icon" href="https://yuki-regal.vercel.app/Yuki1785667118790.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="https://yuki-regal.vercel.app/Yuki1785667118790.jpg" alt="Yuki Store">
                <span>Yuki Store</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="panel.html" class="active">Panel Pterodactyl</a></li>
                <li><a href="sewa-bot.html">Sewa Bot</a></li>
                <li><a href="script.html">Script Yuki</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="section page-header">
        <div class="container">
            <h1 class="page-title">Panel Pterodactyl</h1>
            <p class="page-desc">Pilih paket panel server sesuai kebutuhanmu. VPS R18 C4 • Aktif 30 Hari.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="grid grid-3" id="panelGrid">
                <!-- Generated by JS -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Yuki Store. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <div class="modal" id="paymentModal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/main.js"></script>
    <script>
        const panels = [
            { name: 'Panel 1GB', ram: '1GB', price: 2000, popular: false },
            { name: 'Panel 2GB', ram: '2GB', price: 3000, popular: false },
            { name: 'Panel 3GB', ram: '3GB', price: 4000, popular: false },
            { name: 'Panel 4GB', ram: '4GB', price: 5000, popular: false },
            { name: 'Panel 5GB', ram: '5GB', price: 6000, popular: false },
            { name: 'Panel 6GB', ram: '6GB', price: 7000, popular: false },
            { name: 'Panel 7GB', ram: '7GB', price: 8000, popular: false },
            { name: 'Panel 8GB', ram: '8GB', price: 9000, popular: false },
            { name: 'Panel 9GB', ram: '9GB', price: 10000, popular: false },
            { name: 'Panel 10GB', ram: '10GB', price: 11000, popular: true },
            { name: 'Panel UNLIMITED', ram: 'UNLIMITED', price: 25000, popular: true },
        ];

        const grid = document.getElementById('panelGrid');
        panels.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'product-card fade-in';
            card.style.animationDelay = `${i * 0.05}s`;
            card.innerHTML = `
                ${p.popular ? '<span class="badge badge-popular"><i class="fas fa-fire"></i> POPULAR</span>' : ''}
                <div class="product-icon"><i class="fas fa-server"></i></div>
                <h3 class="product-name">${p.name}</h3>
                <div class="product-specs">
                    <span><i class="fas fa-memory"></i> RAM ${p.ram}</span>
                    <span><i class="fas fa-clock"></i> 30 Hari</span>
                    <span><i class="fas fa-globe"></i> VPS R18 C4</span>
                </div>
                <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                <button class="btn btn-primary btn-full buy-btn" data-name="${p.name}" data-price="${p.price}">
                    Beli Sekarang <i class="fas fa-shopping-cart"></i>
                </button>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
